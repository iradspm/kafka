[project]
name = "kafka_mediator"
authors = [
    { name = "Tiberbu HealthNet Limited", email = "info@tiberbu.com"}
]
description = "Frappe app to connect Kafka and mediator creation of topics, message production and consumption"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    # "frappe~=15.0.0" # Installed and managed by bench.
    "confluent-kafka"
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

# These dependencies are only installed when developer mode is enabled
[tool.bench.dev-dependencies]
# package_name = "~=1.1.0"
